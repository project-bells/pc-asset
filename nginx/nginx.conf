user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for Fast Assets Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # Map for WebSocket Connection Upgrades (Guacamole & Next.js)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Services inside isolated Docker network
    upstream nextjs_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream nodejs_backend {
        server backend:4000;
        keepalive 32;
    }

    upstream guac_webapp {
        server guacamole:8080;
        keepalive 32;
    }

    # =========================================================================
    # 1. HTTP Server (Port 80): Healthcheck & SSL Upgrade
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Internal health probe endpoint
        location /health {
            access_log off;
            return 200 'HEALTHY';
            add_header Content-Type text/plain;
        }

        # Automatic redirect to HTTPS (Required for Mobile QR Camera getUserMedia)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. HTTPS Server (Port 443): Unified SSL Reverse Proxy
    # =========================================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        # SSL Certificates (Self-signed SAN or Corporate PKI)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Allow SAMEORIGIN for Guacamole HTML5 iframe viewer)
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 50M;

        # ---------------------------------------------------------------------
        # Apache Guacamole Web App & WebSocket Tunneling (/guacamole/)
        # ---------------------------------------------------------------------
        location /guacamole/ {
            proxy_pass http://guac_webapp/guacamole/;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path /guacamole/ /guacamole/;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 50m;
        }

        # ---------------------------------------------------------------------
        # Backend API v1 Endpoints (/api/v1/)
        # ---------------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://nodejs_backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 50m;
        }

        # ---------------------------------------------------------------------
        # Backend Direct Health Check
        # ---------------------------------------------------------------------
        location /health {
            proxy_pass http://nodejs_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---------------------------------------------------------------------
        # Next.js 14 Frontend Portal (Catch-all /)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}

