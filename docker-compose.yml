version: '3.8'

# =============================================================================
# Enterprise IT Asset Guard - Production Unified Docker Compose Stack
# Architecture: 6 Services communicating over isolated internal bridge network
# Host Exposition: ONLY Nginx Reverse Proxy exposes Ports 80 and 443
# =============================================================================

networks:
  asset-internal-net:
    name: asset-internal-net
    driver: bridge
    ipam:
      driver: default

volumes:
  pgdata:
    name: asset_pgdata
    driver: local

services:
  # ===========================================================================
  # 1. PostgreSQL 16 Database with Tuned Memory & Automated Migrations
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: it_asset_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_asset_mgmt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c max_wal_size=2GB
      -c min_wal_size=100MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-it_asset_mgmt}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asset-internal-net

  # ===========================================================================
  # 2. Apache Guacamole Proxy Daemon (guacd) - UltraVNC Gateway
  # ===========================================================================
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: it_asset_guacd
    restart: unless-stopped
    volumes:
      # Session video recordings for ISO 27001 audit compliance
      - ./data/guac_recordings:/var/lib/guacamole/recordings:rw
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asset-internal-net

  # ===========================================================================
  # 3. Apache Guacamole Web App with guacamole-auth-json Extension
  # ===========================================================================
  guacamole:
    image: guacamole/guacamole:1.5.5
    container_name: it_asset_guacamole
    restart: unless-stopped
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      WEBAPP_CONTEXT: guacamole
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET_KEY}
    depends_on:
      - guacd
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asset-internal-net

  # ===========================================================================
  # 4. Hardened Node.js/TypeScript Backend API (Port 4000 Internal)
  # ===========================================================================
  backend:
    build:
      context: ./BackendAPI
      dockerfile: Dockerfile
    container_name: it_asset_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-it_asset_mgmt}
      AGENT_API_KEY: ${AGENT_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GUACAMOLE_JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET_KEY}
      GUACAMOLE_INTERNAL_URL: http://guacamole:8080/guacamole
      GUACAMOLE_PUBLIC_URL: /guacamole
      GUACAMOLE_DEFAULT_VNC_PASSWORD: ${GUACAMOLE_DEFAULT_VNC_PASSWORD:-Hospital@2026}
      GUACAMOLE_RECORDING_PATH: /var/lib/guacamole/recordings
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      guacamole:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asset-internal-net

  # ===========================================================================
  # 5. Next.js 14 Standalone Frontend Portal (Port 3000 Internal)
  # ===========================================================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: it_asset_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: /api/v1
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asset-internal-net

  # ===========================================================================
  # 6. Unified Nginx Reverse Proxy & SSL Termination (Ports 80 & 443 Host)
  # ===========================================================================
  nginx:
    image: nginx:stable-alpine
    container_name: it_asset_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      guacamole:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asset-internal-net
