version: '3.8'

services:
  # ===========================================================================
  # 1. PostgreSQL 16+ Database with GIN indexes & automated schema init
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: it_asset_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: it_asset_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secret_db_password_123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./BackendAPI/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_asset_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 2. Hardened Express/TypeScript Backend API (OWASP Top 10)
  # ===========================================================================
  backend:
    build:
      context: ./BackendAPI
      dockerfile: Dockerfile
    container_name: it_asset_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:super_secret_db_password_123!@postgres:5432/it_asset_mgmt
      AGENT_API_KEY: agt_live_9f83a4c28e10b74d92
      JWT_SECRET: super_secret_jwt_key_change_in_production_9948271
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # 3. Next.js 14 Frontend Web Portal (Admin Dashboard & Mobile Field Ops)
  # ===========================================================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: it_asset_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local

